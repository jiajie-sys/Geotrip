services:
  backend:
    build: .
    container_name: geotrip-backend

    command:
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data


  frontend:
    build: .
    container_name: geotrip-frontend

    command:
      streamlit run frontend/app.py
      --server.address 0.0.0.0
      --server.port 8501

    ports:
      - "8501:8501"

    environment:
      API_BASE_URL: http://backend:8000/api/v1

    depends_on:
      - backend